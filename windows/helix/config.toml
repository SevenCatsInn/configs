theme = "github_dark_dim_transparent"
# Make a ./themes/github_dark_dim_transparent.toml file with
# --
# inherits = "github_dark_dimmed"
# "ui.background" = { fg = "foreground" }
# --


[editor]
line-number = "relative"
soft-wrap.enable = true
auto-pairs = false
lsp.auto-signature-help = false
end-of-line-diagnostics = 'hint'
default-yank-register = "+" # Yank to sys clipboard
 
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal.space]
# Hunk manipulation
h = { r = ":reset-diff-change"}
# Stop LSP messages
m = { d = ":lsp-stop", e = ":lsp-restart", n = "goto_next_diag", p = "goto_prev_diag"}

[keys.normal]
# Some nice Helix stuff
C-h = "select_prev_sibling"
C-j = "shrink_selection"
C-k = "expand_selection"
C-l = "select_next_sibling"
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"
 
# Muscle memory
V = ["select_mode", "extend_to_line_bounds"] # Visual line
"C-v" = "copy_selection_on_next_line" # Mimic visual block
"C-r" = "redo"
M = "goto_window_center"
H = "goto_window_top"
L = "goto_window_bottom"
"C-;" = "repeat_last_motion"


[keys.insert]
"C-s" = "signature_help"
j = { k = ["normal_mode", ":write"] }

[keys.select]
V = "extend_to_line_bounds"
G = "extend_to_file_end"
i = "select_textobject_inner"
a = "select_textobject_around"
"C-;" = "repeat_last_motion"
